[project]
name = "sundai-nanofold-bench"
version = "0.1.0"
description = "Local leaderboard service and evaluator for the Sundai nanoFold competition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "pyyaml>=6.0.3",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
]

[tool.uv]
package = false
