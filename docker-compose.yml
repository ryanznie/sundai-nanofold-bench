services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SUNDAI_DB_PATH: /data/leaderboard.db
      SUNDAI_UPLOAD_ROOT: /data/uploads
      SUNDAI_LOG_ROOT: /data/logs
      NANOFOLD_REPO: /opt/sundai/nanofold-competition
      SUNDAI_LOG_LEVEL: INFO
    volumes:
      - ./service:/app/service
      - ./sdk:/app/sdk
      - sundai-api-data:/data
      - ${NANOFOLD_REPO_ROOT:?set NANOFOLD_REPO_ROOT to your local nanoFold-Competition checkout}:/opt/sundai/nanofold-competition:ro

volumes:
  sundai-api-data:
